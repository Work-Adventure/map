<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Camera Reminder</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #1e2b4d;
      color: white;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h2 { margin: 0 0 12px 0; }
    p { color: #cdd6f0; font-size: 15px; margin-bottom: 24px; }
    button {
      padding: 10px 28px;
      font-size: 15px;
      font-weight: bold;
      background: #4a5cff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #3a49d6; }
  </style>
  <script src="https://159.89.198.165.sslip.io/iframe_api.js"></script>
</head>
<body>
  <div class="icon">📷</div>
  <h2>Please turn on your camera</h2>
  <p>Your camera should be turned on when you are in the meeting room.</p>
  <button id="gotItBtn">Got it!</button>
  <script>
    WA.onInit().then(() => {
      document.getElementById("gotItBtn").addEventListener("click", () => {
        WA.ui.modal.closeModal();
      });
    });
  </script>
</body>
</html>
